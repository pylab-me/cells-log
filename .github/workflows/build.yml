name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -v

  build-wheel:
    name: Build wheel
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET || '' }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT || '' }}
      S3_PREFIX: ${{ vars.S3_PREFIX || 'builds' }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Check wheel metadata
        run: |
          python -m twine check dist/*.whl

      - name: List dist
        run: |
          ls -al dist

      - name: S3/R2 Upload
        if: ${{ env.AWS_ACCESS_KEY_ID && env.S3_BUCKET && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          CLEAN_PREFIX=$(python3 -c "import os; print(os.getenv('S3_PREFIX', '').strip('/'))")
          CLEAN_BUCKET=$(python3 -c "import os; print(os.getenv('S3_BUCKET', '').strip('/'))")
          aws s3 cp dist/ s3://${CLEAN_BUCKET}/${CLEAN_PREFIX:-builds}/ \
            --recursive \
            --exclude "*" \
            --include "*.whl" \
            --endpoint-url ${{ env.S3_ENDPOINT }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build-wheel
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.event.repository.name }}-wheel
          path: dist

      - name: Resolve release metadata
        id: release_meta
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "release_tag=rolling" >> "$GITHUB_OUTPUT"
            echo "release_name=rolling" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release_name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        run: |
          {
            echo "Automated cells-log wheel build."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Source ref: ${GITHUB_REF_NAME}"
            echo "- Built at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > RELEASE_NOTES.md

      - name: Update rolling tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag --force rolling "$GITHUB_SHA"
          git push --force origin refs/tags/rolling

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: dist/*.whl
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: ${{ steps.release_meta.outputs.make_latest != 'true' }}
          make_latest: ${{ steps.release_meta.outputs.make_latest }}

      - name: Remove outdated rolling wheels
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view rolling --json assets --jq '.assets[].name | select(endswith(".whl"))' > rolling-wheels.txt
          while IFS= read -r asset; do
            if [ ! -f "dist/$asset" ]; then
              gh release delete-asset rolling "$asset" --yes
            fi
          done < rolling-wheels.txt
