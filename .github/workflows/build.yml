name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        shell: bash
        run: |
          python -m pytest -v

  build-wheel:
    name: Build wheel
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ vars.S3_BUCKET || '' }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT || '' }}
      S3_PREFIX: ${{ vars.S3_PREFIX || 'builds' }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION || 'auto' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Check wheel metadata
        run: |
          python -m twine check dist/*.whl

      - name: List dist
        run: |
          ls -al dist

      - name: S3/R2 Upload
        if: ${{ env.AWS_ACCESS_KEY_ID && env.S3_BUCKET && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          CLEAN_PREFIX=$(python3 -c "import os; print(os.getenv('S3_PREFIX', '').strip('/'))")
          CLEAN_BUCKET=$(python3 -c "import os; print(os.getenv('S3_BUCKET', '').strip('/'))")
          aws s3 cp dist/ s3://${CLEAN_BUCKET}/${CLEAN_PREFIX:-builds}/ \
            --recursive \
            --exclude "*" \
            --include "*.whl" \
            --endpoint-url ${{ env.S3_ENDPOINT }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
